<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      /* id Selector */
      #head {
        color: red;
      }

      /* Class Selector */
      .heading2 {
        color: blueviolet;
      }

      /* Tag or Element Selector */
      p {
        color: green;
      }

      h4,
      span,
      pre {
        color: orange;
      }

      *{
        color: blue;
      }

    </style>
  </head>
  <body>
    <!-- Selectors -->
    <!-- 1. Id Selector (#) -->
    <h1>This is heading 1</h1>
    <h1>This is heading 1</h1>
    <h1 id="head">This is heading 1</h1>

    <!-- 2. Class Selector (.) -->
    <h2>This is heading 2</h2>
    <h2 class="heading2">This is heading 2</h2>
    <h2>This is heading 2</h2>
    <h2 class="heading2">This is heading 2</h2>
    <h2 class="heading2">This is heading 2</h2>

    <!-- 3. Tag or Element Selector -->
    <p>This is paragraph</p>
    <p>This is paragraph</p>
    <p>This is paragraph</p>

    <!-- 4. Grouping Selector (,) -->
    <h4>This is h4</h4>
    <span>This is span</span>
    <pre>This is pre</pre>

    <!-- 5. Universal Selector (*) -->

  </body>
</html>
