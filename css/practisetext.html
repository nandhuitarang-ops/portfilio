<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            /* text color */
            color:  red;

            /* text alignment */
            text-align: justify;

            /* text decoration */
            text-decoration: underline;

            /* text transformation */
            text-transform: none;

            /* text spacing */
            /* text indent */
            text-indent: 50px;

            /* letter spacing */
            letter-spacing: 7px;

            /* word spacing */
            word-spacing: 20px;

            /* text shadow (x y Blur color*/
            text-shadow: 5px 5px 2px  darkgreen;
        }
    </style>
</head>
<body>
    
    <!-- Text color -->
    <!-- Text alignment -->
    <!-- Text Decoration -->
    <!-- Text Transformation -->
    <!-- Text Spacing -->
    <!-- Text Shadow -->

    <p> 
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Vel veniam eaque, impedit quod non tempora omnis assumenda nisi 
        quisquam! Minima error maxime magnam a. Ex temporibus cum laboriosam doloribus? Accusamus?
    </p>
</body>
</html>
