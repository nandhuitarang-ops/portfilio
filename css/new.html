<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Dussehra</title>
    <style>
        h1 img{
            width: 60px;
            height: 50px;
            vertical-align: middle;
        }
        body {
            background: #fff0d0;
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            padding: 20px;
        }

        .banner {
            background: #25070c;
            color: gold;
            padding: 25px;
            border: 3px double gold;
            border-radius: 50px;
        }
        h1 {
            font-size: 35px;
        }
        img {
            width: 290px;
            height: 390px;
            border-radius: 20px;
            border: 2px solid rgb(48, 41, 3);
            object-fit: cover;
        }
        p{
            color: rgb(197, 162, 20);
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="banner">
        <h1>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRefPGO2ZSbc293jTKy9aER0qSvlfZNyZ5tgqhwwNm7xw&s=10" alt="diya">
            Hapy Dussehra
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRefPGO2ZSbc293jTKy9aER0qSvlfZNyZ5tgqhwwNm7xw&s=10" alt="diya">
        </h1>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRP7kZAQw3EmMNdXAC-zHhMrgPfSnetTuLQGxEqItvqiF-0fh0sA9Pn653V&s=10" alt="Ammavaru">
        <p>May Goddess Durga bless you with happiness,<br>peace, prosperity and success </p>
        <h2>Happy Vijayadashami</h2>
    </div>
</body>

</html>
